<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Core AI - Advanced AI Services</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .banner-container {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-radius: 12px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(102, 126, 234, 0.3);
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-text {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
            }
            50% {
                text-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
            }
        }

        .tagline {
            font-size: 18px;
            color: #e0e0e0;
            margin-bottom: 15px;
            font-weight: 300;
        }

        .highlight {
            color: #667eea;
            font-weight: 600;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .feature {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .feature:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.6);
            transform: translateY(-5px);
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .feature-title {
            font-size: 16px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .feature-desc {
            font-size: 13px;
            color: #b0b0b0;
        }

        .cta-section {
            margin-top: 40px;
            text-align: center;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .cta-button:active {
            transform: translateY(-1px);
        }

        .url-link {
            display: block;
            margin-top: 20px;
            font-size: 14px;
            color: #667eea;
            text-decoration: none;
            word-break: break-all;
        }

        .url-link:hover {
            text-decoration: underline;
            color: #764ba2;
        }

        .badge {
            display: inline-block;
            background: rgba(118, 75, 162, 0.2);
            border: 1px solid #764ba2;
            color: #764ba2;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin: 10px 5px 0 5px;
        }

        @media (max-width: 600px) {
            .banner-container {
                padding: 25px;
            }

            .logo-text {
                font-size: 32px;
            }

            .tagline {
                font-size: 16px;
            }

            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <div class="header">
            <div class="logo-text">✨ Pixel Core AI</div>
            <div class="tagline">
                Передовые <span class="highlight">AI решения</span> для вашего бизнеса
            </div>
            <span class="badge">🚀 Инновационная платформа</span>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🤖</div>
                <div class="feature-title">Умный AI</div>
                <div class="feature-desc">Продвинутые алгоритмы машинного обучения</div>
            </div>

            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-title">Быстро</div>
                <div class="feature-desc">Молниеносная обработка данных</div>
            </div>

            <div class="feature">
                <div class="feature-icon">🔒</div>
                <div class="feature-title">Безопасно</div>
                <div class="feature-desc">Защита данных высшего уровня</div>
            </div>

            <div class="feature">
                <div class="feature-icon">🌐</div>
                <div class="feature-title">Облачное</div>
                <div class="feature-desc">Доступно с любого места</div>
            </div>
        </div>

        <div class="cta-section">
            <button class="cta-button" onclick="window.open('https://kind-pixel-core-ai.base44.app', '_blank')">
                🚀 Попробовать Сейчас
            </button>
            <a href="https://kind-pixel-core-ai.base44.app" class="url-link" target="_blank">
                https://kind-pixel-core-ai.base44.app
            </a>
        </div>
    </div>
</body>
</html>
